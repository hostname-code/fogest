<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Наш Telegram</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
    }

    .container {
      background: rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    h1 {
      margin-bottom: 20px;
    }

    .btn {
      display: block;
      margin: 10px 0;
      padding: 15px;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      transition: 0.3s;
    }

    .main {
      background: #0088cc;
      font-size: 18px;
    }

    .admin {
      background: #444;
    }

    .btn:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 14px;
      opacity: 0.8;
    }

    footer a {
      color: #00c6ff;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Наш Telegram</h1>

    <a class="btn main" href="https://t.me/JETFlora" target="_blank">📢 Наш канал</a>

    <a class="btn admin" href="https://t.me/Hastler713" target="_blank">👤 Администратор 1</a>

    <a class="btn admin" href="https://t.me/Hastler713" target="_blank">👤 Администратор 2</a>
  </div>

  <footer>
    sudo apt install xfce4 xfce4-goodies -y
    <a href="https://t.me/+Vw9Q63MF0FsxODdi" target="_blank">Напиши мне</a>
  </footer>

</body>
</html>
